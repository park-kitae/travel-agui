[package]
name = "travel-agui"
version = "0.1.0"
description = "Travel AI AG-UI Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "travel_agui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
